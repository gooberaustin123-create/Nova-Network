<!DOCTYPE html>
<html>
<head>
  <title>NOVA NETWORK</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #2b0000, #0a0000);
      font-family: Arial, sans-serif;
      color: white;
      overflow: hidden;
    }

    /* Glowing particle background */
    .particles {
      position: fixed;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background-image: radial-gradient(circle, rgba(255,0,150,0.4) 2px, transparent 2px),
                        radial-gradient(circle, rgba(255,0,150,0.3) 2px, transparent 2px),
                        radial-gradient(circle, rgba(255,0,150,0.2) 2px, transparent 2px);
      background-size: 120px 120px, 200px 200px, 160px 160px;
      animation: drift 20s linear infinite;
    }

    @keyframes drift {
      from { transform: translateY(0px); }
      to { transform: translateY(-200px); }
    }

    #container {
      position: relative;
      z-index: 2;
      text-align: center;
      margin-top: 80px;
    }

    #title {
      font-size: 48px;
      font-weight: bold;
      color: #ff7a00;
      text-shadow: 0 0 20px #ff4500;
      margin-bottom: 10px;
    }

    #tagline {
      font-size: 18px;
      opacity: 0.8;
      margin-bottom: 40px;
    }

    #search-box {
      display: flex;
      justify-content: center;
      margin-bottom: 40px;
    }

    #search-input {
      width: 350px;
      padding: 12px;
      border-radius: 6px 0 0 6px;
      border: none;
      outline: none;
      background: rgba(255,255,255,0.1);
      color: white;
      font-size: 16px;
    }

    #search-btn {
      padding: 12px 20px;
      background: #ff0000;
      border: none;
      border-radius: 0 6px 6px 0;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .tile-container {
      display: flex;
      justify-content: center;
      gap: 30px;
    }

    .tile {
      width: 160px;
      height: 100px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: 0.2s;
    }

    .tile:hover {
      background: rgba(255,255,255,0.15);
      transform: scale(1.05);
    }

    .tile-icon {
      font-size: 28px;
      margin-bottom: 8px;
    }
  </style>
</head>

<body>
  <div class="particles"></div>

  <div id="container">
    <div id="title">NOVA NETWORK</div>
    <div id="tagline">Browse Free — No Limits</div>

    <div id="search-box">
      <input id="search-input" placeholder="Search or type a URL...">
      <button id="search-btn">GO</button>
    </div>

    <div class="tile-container">
      <div class="tile">
        <div class="tile-icon">🎮</div>
        <div>Games</div>
      </div>

      <div class="tile">
        <div class="tile-icon">⚙️</div>
        <div>Add-ons</div>
      </div>
    </div>
  </div>
</body>
</html>
